; Configuracion de CouchDB en Railway

[couchdb]
; un solo servidor: crea solo las bases de sistema (_users, _replicator)
single_node = true

[chttpd]
; escuchar tambien en IPv6 (la red privada de Railway usa IPv6)
bind_address = ::
; nada sin usuario y contraseña (ni siquiera la pagina de bienvenida)
require_valid_user = true

[chttpd_auth]
require_valid_user = true
